<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>BusGo</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <b>🚌 BusGo</b>
            <nav><a href="/">Home</a>
                <a href="bookings.html">My Bookings</a>
                <a href="login.html">Login</a>
            </nav>
        </header>
        <main class="hero">
            <h1>Book your bus journey.</h1>
            <p>Search buses, choose seats and travel with confidence.</p>
            <div class="search">
                <input id="source" placeholder="From">
                <input id="destination" placeholder="To">
                <input id="date" type="date">
                <button onclick="go()">Search</button>
            </div>
        </main>
        <script src="js/common.js">
            
        </script>

<script>
const date = document.getElementById("date");
const source = document.getElementById("source");
const destination = document.getElementById("destination");

const today = new Date();
date.value =
    today.getFullYear() + "-" +
    String(today.getMonth() + 1).padStart(2, "0") +
    "-" +
    String(today.getDate()).padStart(2, "0");

function go() {
    location =
        "buses.html?source=" +
        encodeURIComponent(source.value.trim()) +
        "&destination=" +
        encodeURIComponent(destination.value.trim()) +
        "&date=" +
        date.value;
}
</script></body></html>
