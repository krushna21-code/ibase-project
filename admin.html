<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - BusGo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <b>🚌 BusGo Admin</b>
    <button onclick="logout()">Logout</button>
  </header>

  <main class="container">
    <h1>Admin Dashboard</h1>

    <div class="stats">
      <div class="card">
        <b>Buses</b>
        <h2 id="bc">0</h2>
      </div>
      <div class="card">
        <b>Bookings</b>
        <h2 id="kc">0</h2>
      </div>
      <div class="card">
        <b>Revenue</b>
        <h2 id="rev">₹0</h2>
      </div>
    </div>

    <div class="card">
      <h2>Add Bus</h2>
      <form id="f" class="grid">
        <input id="bus_name" placeholder="Bus name" required>
        <input id="bus_number" placeholder="Bus number" required>
        <input id="bus_type" placeholder="Bus type" required>
        <input id="source" placeholder="Source" required>
        <input id="destination" placeholder="Destination" required>
        <input id="departure_time" type="time" required>
        <input id="arrival_time" type="time" required>
        <input id="journey_date" type="date" required>
        <input id="fare" type="number" placeholder="Fare" required>
        <input id="total_seats" type="number" value="40" required>
        <button>Add Bus</button>
      </form>
    </div>

    <h2>Buses</h2>
    <div id="buses"></div>

    <h2>Bookings</h2>
    <div id="bookings"></div>
  </main>

  <script src="js/common.js"></script>
  <script>
    auth();

    if (JSON.parse(localStorage.user || '{}').role !== 'admin') {
      location = '/';
    }

    async function load() {
      let [b, k] = await Promise.all([
        api('/buses'),
        api('/bookings/admin/all')
      ]);

      bc.textContent = b.length;
      kc.textContent = k.length;
      rev.textContent = '₹' + k
        .filter(x => x.status === 'Confirmed')
        .reduce((a, x) => a + Number(x.total_amount), 0);

      buses.innerHTML = b.map(x => `
        <div class="card row">
          <span>
            <b>${x.bus_name}</b> · ${x.source} → ${x.destination} · ₹${x.fare}
          </span>
          <button onclick="del(${x.id})">Delete</button>
        </div>
      `).join('');

      bookings.innerHTML = k.map(x => `
        <div class="card row">
          <span>
            <b>${x.booking_id}</b> · ${x.user_name} · ${x.bus_name}
          </span>
          <span>
            ₹${x.total_amount} · ${x.status}
          </span>
        </div>
      `).join('');
    }

    f.onsubmit = async e => {
      e.preventDefault();

      await api('/buses', {
        method: 'POST',
        body: JSON.stringify({
          bus_name: bus_name.value,
          bus_number: bus_number.value,
          bus_type: bus_type.value,
          source: source.value,
          destination: destination.value,
          departure_time: departure_time.value,
          arrival_time: arrival_time.value,
          journey_date: journey_date.value,
          fare: fare.value,
          total_seats: total_seats.value
        })
      });

      f.reset();
      load();
    };

    async function del(id) {
      if (confirm('Delete bus?')) {
        await api('/buses/' + id, { method: 'DELETE' });
        load();
      }
    }

    load();
  </script>
</body>
</html>
